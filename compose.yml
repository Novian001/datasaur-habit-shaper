name: datasaur-habit-shaper

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-habit_shaper}
      MYSQL_USER: ${MYSQL_USER:-habit_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-habit_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-habit_root_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-habit_user}:${MYSQL_PASSWORD:-habit_password}@db:3306/${MYSQL_DATABASE:-habit_shaper}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
